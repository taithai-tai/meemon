name: Maintain Meemon Orders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meemon-order-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://jfbfsarmyzvgtvwqapkf.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
    steps:
      - name: Expire unpaid orders and retry delayed checks
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$MAINTENANCE_SECRET" ]; then
            echo "::warning::Order maintenance skipped because SUPABASE_SERVICE_ROLE_KEY or MAINTENANCE_SECRET is not configured."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "x-maintenance-secret: $MAINTENANCE_SECRET" \
            "$SUPABASE_URL/functions/v1/maintenance"
