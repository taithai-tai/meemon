name: Deploy Meemon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meemon-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.15.1"
  SUPABASE_PROJECT_REF: "jfbfsarmyzvgtvwqapkf"
  SUPABASE_URL: "https://jfbfsarmyzvgtvwqapkf.supabase.co"

jobs:
  build:
    name: Build and verify website
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://jfbfsarmyzvgtvwqapkf.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_b23qXSqWre20GrAYV2ydrw_Cf9pv43o"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAEDhe_nNg-o9cOAI"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global "pnpm@$PNPM_VERSION"

      - name: Install V2 dependencies
        working-directory: v2/_source
        run: pnpm install --frozen-lockfile

      - name: Run V2 data tests
        working-directory: v2/_source
        run: pnpm test

      - name: Build V2 and copy legacy apps
        working-directory: v2/_source
        run: pnpm run publish:static

      - name: Verify every legacy and V2 route
        run: node scripts/test-github-pages.mjs

      - name: Prepare public Pages artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/.vscode/' \
            --exclude '/.DS_Store' \
            --exclude '/.gitignore' \
            --exclude '/_site/' \
            --exclude '/legacy-snapshots/' \
            --exclude '/scripts/' \
            --exclude '/supabase/' \
            --exclude '/SUPABASE_SETUP.md' \
            --exclude '/v2/_source/' \
            ./ _site/

      - name: Confirm backend secrets are absent from the website
        shell: bash
        env:
          CHECK_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CHECK_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CHECK_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHECK_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CHECK_MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          CHECK_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          for name in \
            CHECK_SUPABASE_ACCESS_TOKEN \
            CHECK_SUPABASE_DB_PASSWORD \
            CHECK_SUPABASE_SERVICE_ROLE_KEY \
            CHECK_TURNSTILE_SECRET_KEY \
            CHECK_MAINTENANCE_SECRET \
            CHECK_ADMIN_BOOTSTRAP_PASSWORD
          do
            value="${!name}"
            if [ -n "$value" ] && rg --fixed-strings --quiet "$value" _site; then
              echo "A protected value was found in the public website: $name"
              exit 1
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish website
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
