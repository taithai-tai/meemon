<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Taithai Tarot | เลือกไพ่ 10 ใบ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      /* ปรับง่ายถ้าจะเปลี่ยนทีหลัง */
      --bg-main: radial-gradient(circle at top, #05081f, #02010b);
      --accent: #fbbf24;
      --accent-soft: #ffd93d;
      --text-main: #f9fafb;
      --text-soft: #9ca3af;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      text-align: center;
      margin: 0;
      padding: 16px 10px 24px;
    }

    .page {
      max-width: 480px;       /* เน้นมือถือก่อน */
      margin: 0 auto;
    }

    h1 {
      margin: 6px 0 4px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 1rem;
    }

    .subtitle {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    #count {
      margin: 4px 0 10px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* วงไพ่ – mobile-first */
    .circle-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .circle {
      width: 90vw;
      height: 90vw;
      max-width: 420px;
      max-height: 420px;
      position: relative;
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16vw;              /* การ์ดใหญ่พอให้จิ้มง่าย */
      max-width: 70px;
      min-width: 45px;
      aspect-ratio: 7 / 12;     /* รักษาสัดส่วนไพ่ */
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      cursor: pointer;
      filter: brightness(0.75);
      transition:
        transform 0.16s ease,
        filter 0.16s ease,
        box-shadow 0.16s ease,
        outline-width 0.1s ease;
    }

    .card:hover {
      filter: brightness(1);
      box-shadow: 0 8px 16px rgba(0,0,0,0.8);
    }

    .card.selected {
      outline: 3px solid var(--accent-soft);
      filter: brightness(1.15);
      transform: translate(-50%, -50%) scale(1.12) !important;
      z-index: 5;
    }

    /* ปุ่ม – จัดให้เหมาะกับนิ้วโป้ง */
    .btn-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    button {
      flex: 1 1 30%;
      min-width: 90px;
      padding: 9px 10px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    #shuffleBtn,
    #cutBtn {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid rgba(148,163,184,0.7);
    }

    #submitBtn {
      background: var(--accent);
      color: #111827;
    }

    #submitBtn:disabled {
      background: #4b5563;
      color: var(--text-soft);
      cursor: not-allowed;
    }

    /* ผลการทำนาย */
    #resultSection {
      margin-top: 14px;
      padding: 10px 10px 14px;
      border-radius: 16px;
      background: rgba(15,23,42,0.88);
      border: 1px solid rgba(148,163,184,0.35);
      display: none;
    }

    #resultSection h2 {
      margin: 0 0 6px;
      font-size: 0.95rem;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .result-card {
      background: radial-gradient(circle at top, #111827, #020617);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid rgba(55,65,81,0.9);
      font-size: 0.78rem;
    }

    .result-card img {
      width: 100%;
      border-radius: 8px;
      display: block;
      margin-bottom: 4px;
    }

    .result-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .result-meaning {
      opacity: 0.92;
      line-height: 1.3;
    }

    .disclaimer {
      margin-top: 8px;
      font-size: 0.7rem;
      opacity: 0.65;
      line-height: 1.4;
    }

    /* 🖥 ปรับเพิ่มสำหรับ tablet / จอใหญ่หน่อย */
    @media (min-width: 768px) {
      body {
        padding-top: 24px;
      }
      h1 {
        font-size: 1.2rem;
      }
      .subtitle {
        font-size: 0.9rem;
      }
      .circle {
        width: 420px;
        height: 420px;
      }
      .card {
        width: 70px;
      }
      .result-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      #resultSection h2 {
        font-size: 1.05rem;
      }
      .result-card {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>TAITHAI TAROT 🔮</h1>
    <div class="subtitle">

    </div>
    <div id="count">เลือกแล้ว: 0 / 10</div>

    <div class="circle-wrapper">
      <div class="circle" id="deck"></div>
    </div>

    <div class="btn-row">
      <button id="shuffleBtn">สับไพ่</button>

      </div>
    </div>
  </div>

      { name: "Ace of Pentacles", file: "ACES OF PENTACLES.png", meaning: "โอกาสใหม่ด้านการเงิน งาน หรือของที่จับต้องได้" },
      { name: "Two of Pentacles", file: "2 OF PENTACLES.png", meaning: "การหมุนเงิน ทำหลายอย่างพร้อมกัน จัดสมดุลชีวิต–งาน" },
      { name: "Three of Pentacles", file: "3 OF PENTACLES.png", meaning: "การทำงานเป็นทีม การสร้างผลงานให้คนอื่นเห็นคุณค่า" },
      { name: "Four of Pentacles", file: "4 OF PENTACLES.png", meaning: "ยึดติดกับเงินหรือความปลอดภัยเกินไป กลัวเสียสิ่งที่มี" },
      { name: "Five of Pentacles", file: "5 OF PENTACLES.png", meaning: "รู้สึกขาด รายได้ฝืด ความกังวลด้านการเงิน ต้องมองหาความช่วยเหลือ" },
      { name: "Six of Pentacles", file: "6 OF PENTACLES.png", meaning: "การแบ่งปัน การให้–การรับ ความสมดุลด้านทรัพยากร" },
      { name: "Seven of Pentacles", file: "7 OF PENTACLES.png", meaning: "รอผลจากสิ่งที่ลงทุนไปแล้ว ต้องใช้เวลาและความอดทน" },
      { name: "Eight of Pentacles", file: "8 OF PENTACLES.png", meaning: "ฝึกฝนทักษะ ทำงานละเอียด ซ้ำ ๆ เพื่อเก่งขึ้น" },
      { name: "Nine of Pentacles", file: "9 OF PENTACLES.png", meaning: "ความมั่งคั่งจากน้ำพักน้ำแรงของตัวเอง ใช้ชีวิตแบบมีระดับ" },
      { name: "Ten of Pentacles", file: "10 OF PENTACLES.png", meaning: "ความมั่นคงระยะยาว ครอบครัว ทรัพย์สิน มรดก" },
      { name: "Page of Pentacles", file: "page OF PENTACLES.png", meaning: "เริ่มเรียนรู้เรื่องเงิน/งานใหม่ ๆ ข้อเสนอเล็ก ๆ แต่มีอนาคต" },
      { name: "Knight of Pentacles", file: "knights OF PENTACLES.png", meaning: "ทำงานอย่างสม่ำเสมอ ช้าแต่ชัวร์ ระยะยาวมั่นคง" },
      { name: "Queen of Pentacles", file: "queen OF PENTACLES.png", meaning: "ดูแลบ้าน การเงิน และคนรอบข้างได้ดี มีความเป็นแม่สูง" },
      { name: "King of Pentacles", file: "king OF PENTACLES.png", meaning: "เจ้าของกิจการ/ผู้บริหารที่มั่งคั่ง คิดเรื่องความมั่นคงการเงินระยะยาว" }
    ];

    const deckEl = document.getElementById("deck");
    const countEl = document.getElementById("count");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const cutBtn = document.getElementById("cutBtn");
    const submitBtn = document.getElementById("submitBtn");
    const resultSection = document.getElementById("resultSection");
    const resultGrid = document.getElementById("resultGrid");
    const MAX_PICK = 10;

    let deckOrder = [];
    let selected = [];

    function initDeck() {
      deckOrder = cardFaces.map((_, i) => i);
      shuffleArray(deckOrder);
      selected = [];
      countEl.textContent = `เลือกแล้ว: 0 / ${MAX_PICK}`;
      submitBtn.disabled = true;
      resultSection.style.display = "none";
      placeCards();
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function placeCards() {
      deckEl.innerHTML = "";
      const n = deckOrder.length;
      const radius = Math.min(deckEl.offsetWidth, deckEl.offsetHeight) / 2 - 40; // ปรับตามขนาดจอ

      for (let i = 0; i < n; i++) {
        const angle = (360 / n) * i;
        const rad = angle * (Math.PI / 180);

        const card = document.createElement("div");
        card.className = "card";
        card.style.backgroundImage = `url("${IMAGE_BASE + CARD_BACK}")`;

        const x = Math.cos(rad) * radius;
        const y = Math.sin(rad) * radius;
        card.style.transform =
          `translate(-50%, -50%) translate(${x}px, ${y}px) rotate(${angle + 90}deg)`;

        const cardIndex = deckOrder[i];
        card.dataset.cardIndex = cardIndex;
        card.addEventListener("click", () => toggleSelect(card));
        deckEl.appendChild(card);
      }
    }

    function toggleSelect(cardEl) {
      const cardIndex = Number(cardEl.dataset.cardIndex);

      if (!cardEl.classList.contains("selected")) {
        if (selected.length >= MAX_PICK) return;
        cardEl.classList.add("selected");
        selected.push(cardIndex);
      } else {
        cardEl.classList.remove("selected");
        selected = selected.filter(i => i !== cardIndex);
      }

      countEl.textContent = `เลือกแล้ว: ${selected.length} / ${MAX_PICK}`;
      submitBtn.disabled = (selected.length !== MAX_PICK);
    }

    shuffleBtn.addEventListener("click", () => {
      shuffleArray(deckOrder);
      selected = [];
      countEl.textContent = `เลือกแล้ว: 0 / ${MAX_PICK}`;
      submitBtn.disabled = true;
      resultSection.style.display = "none";
      placeCards();
    });

    cutBtn.addEventListener("click", () => {
      const half = Math.floor(deckOrder.length / 2);
      deckOrder = deckOrder.slice(half).concat(deckOrder.slice(0, half));
      selected = [];
      countEl.textContent = `เลือกแล้ว: 0 / ${MAX_PICK}`;
      submitBtn.disabled = true;
      resultSection.style.display = "none";
      placeCards();
    });

    submitBtn.addEventListener("click", () => {
      resultGrid.innerHTML = "";
      selected.forEach((idx, i) => {
        const data = cardFaces[idx];
        const cardDiv = document.createElement("div");
        cardDiv.className = "result-card";

        const img = document.createElement("img");
        img.src = IMAGE_BASE + data.file;
        img.alt = data.name;

        const nameEl = document.createElement("div");
        nameEl.className = "result-name";
        nameEl.textContent = `ใบที่ ${i + 1}: ${data.name}`;

        const meaningEl = document.createElement("div");
        meaningEl.className = "result-meaning";
        meaningEl.textContent = data.meaning || "";

        cardDiv.appendChild(img);
        cardDiv.appendChild(nameEl);
        cardDiv.appendChild(meaningEl);
        resultGrid.appendChild(cardDiv);
      });

      resultSection.style.display = "block";
      resultSection.scrollIntoView({ behavior: "smooth" });
    });

    window.addEventListener("resize", () => {
      // เวลาเปลี่ยน orientation ให้จัดวงใหม่
      placeCards();
    });

    initDeck();
  </script>
</body>
</html>
