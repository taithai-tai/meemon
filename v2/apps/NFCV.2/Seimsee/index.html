<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>MEEMON Seimsee | เสี่ยงเซียมซีออนไลน์</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ฟอนต์ -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: radial-gradient(circle at top, #020617, #000000);
      --card-bg: rgba(15, 23, 42, 0.9);
      --accent: #fbbf24;
      --accent-soft: #facc15;
      --text-main: #f9fafb;
      --text-soft: #9ca3af;
      --danger: #f87171;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Kanit", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 24px 22px 26px;
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(148, 163, 184, 0.25);
      backdrop-filter: blur(18px);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 14px;
      background: radial-gradient(circle at 30% 0%, #fef9c3, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 26px rgba(248, 250, 252, 0.35);
      animation: float 3s ease-in-out infinite;
    }

    .logo-circle span {
      font-size: 40px;
    }

    .title {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-soft);
      margin-top: 4px;
      line-height: 1.5;
    }

    .shake-box {
      margin: 22px 0 10px;
      display: flex;
      justify-content: center;
    }

    .box-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .lamp {
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 249, 195, 0.65), transparent 60%);
      opacity: 0.9;
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(1px);
    }

    .seimsee-img {
      position: relative;
      height: 210px;
      max-width: 80%;
      object-fit: contain;
      user-select: none;
      cursor: pointer;
      z-index: 1;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .seimsee-img.tap-shake {
      animation: tapShake 0.35s ease;
    }

    .box-visual.box-shake {
      animation: shakeBox 0.7s ease-in-out;
    }

    .hint {
      text-align: center;
      font-size: 0.92rem;
      color: var(--text-soft);
      margin-bottom: 4px;
    }

    .tap-status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--accent-soft);
      margin-bottom: 14px;
    }

    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-soft);
      opacity: 0.7;
    }

    /* ===== Modal (ป๊อปอัป) ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-backdrop.show {
      display: flex;
      animation: fadeInBackdrop 0.2s ease-out;
    }

    .modal {
      background: radial-gradient(circle at top, #020617, #020617);
      border-radius: 22px;
      padding: 18px 16px 18px;
      width: 100%;
      max-width: 430px;
      box-shadow:
        0 22px 40px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(148, 163, 184, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.6);
      animation: fadeInUp 0.25s ease-out;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 12px;
    }

    .result-number {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--accent-soft);
    }

    .result-level {
      font-size: 0.9rem;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      color: var(--text-main);
      white-space: nowrap;
    }

    .result-level.good {
      border-color: var(--success);
      color: var(--success);
    }

    .result-level.bad {
      border-color: var(--danger);
      color: var(--danger);
    }

    .modal-close-btn {
      margin-left: auto;
      border: none;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-soft);
      border: 1px solid rgba(148, 163, 184, 0.7);
    }

    .modal-close-btn:active {
      transform: translateY(1px);
    }

    .result-title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .result-main {
      font-size: 0.95rem;
      color: var(--text-soft);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .result-advice-label {
      font-size: 0.85rem;
      color: var(--accent-soft);
      margin-bottom: 3px;
    }

    .result-advice {
      font-size: 0.93rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes shakeBox {
      0% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-4px) rotate(-2deg); }
      40% { transform: translateX(4px) rotate(2deg); }
      60% { transform: translateX(-3px) rotate(-1.5deg); }
      80% { transform: translateX(3px) rotate(1.5deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes tapShake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-4px) rotate(-1deg); }
      40%  { transform: translateX(4px) rotate(1deg); }
      60%  { transform: translateX(-3px) rotate(-0.7deg); }
      80%  { transform: translateX(3px) rotate(0.7deg); }
      100% { transform: translateX(0); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInBackdrop {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (min-width: 600px) {
      .card {
        padding: 26px 26px 28px;
      }
    }
  </style>
</head>
<body>
  
  <script src="/v2/apps/shared/token.js"></script>
    <script>
      window.onload = () => {
        Token.useOnce({
          cleanUrl: false,

          // ครั้งแรก → เงียบ ๆ แค่เปิดหน้าให้ดู
          onFirstUse() {
            document.body.style.display = "block";
          },

          // ถ้าใช้โทเคนเดิมเข้าใหม่ (เช่น refresh / ส่งลิงก์ให้เพื่อนในเครื่องเดียวกัน)
          onAlreadyUsed() {
            window.location.href = "/v2/apps/NFCV.2/sorry.jpg";
          },

          // ถ้าไม่มีโทเคน หรือโทเคนไม่ถูกต้อง
          onInvalid() {
            window.location.href = "/v2/apps/NFCV.2/sorry.jpg";
          },
        });
      };
    </script>
  
  <div class="app">
    <div class="card">
      <div class="header">
        <div class="logo-circle">
          <span>🧧</span>
        </div>
        <div class="title">เสี่ยงเซียมซี MEEMON</div>
        <div class="subtitle">
          ตั้งจิตให้สงบ แล้วแตะที่รูปเซียมซี<br />
          5 ครั้งติดกันเพื่อเสี่ยงเซียมซี 💫
        </div>
      </div>

      <div class="shake-box">
        <div class="box-visual" id="boxVisual">
          <div class="lamp"></div>
          <img
            src="/v2/apps/NFCV.2/Seimsee/Seimsee.png"
            alt="เซียมซี"
            class="seimsee-img"
            id="seimseeImg"
          />
        </div>
      </div>

      <div class="hint">
      </div>
      <div id="tapStatus" class="tap-status">
        แตะที่รูป 5 ครั้งภายในเวลาสั้น ๆ ระบบจะสุ่มใบเซียมซีให้คุณ 🎲
      </div>

      <div class="footer">
        <span id="yearNow"></span> V1.5
      </div>
    </div>
  </div>

  <!-- Modal แสดงผลเซียมซี -->

      <div class="result-advice" id="resultAdvice"></div>
    </div>
  </div>

        advice:
          "เก็บโมเมนต์เล็ก ๆ เหล่านี้ไว้เป็นพลังใจ แล้วใช้มันเป็นแรงผลักให้ทำสิ่งใหญ่ขึ้น",

      {

        advice:
          "ก่อนจ่ายให้ถามตัวเองว่า ‘จำเป็นจริงไหม’ ถ้ายังลังเล แปลว่ายังไม่จำเป็น",

      {

        advice:
          "ใช้ช่วงนี้สร้าง connection ดี ๆ รู้จักคนใหม่ ๆ และรักษาความจริงใจเอาไว้",
      },
      {

        main: "คุณอาจลังเลระหว่างสองทางเลือกที่ต่างกันสุดขั้ว",
        advice:
          "ลองเขียนข้อดี–ข้อเสียของแต่ละทางออกมา แล้วเลือกสิ่งที่สอดคล้องกับตัวตนและเป้าหมายระยะยาวที่สุด",
      },
      {

        advice:
          "อย่าฝืนให้เก่งตลอดเวลา อนุญาตให้ตัวเองอ่อนแอได้บ้าง แล้วค่อยกลับมาเริ่มใหม่อีกครั้ง",
      },
      {
        number: 24,
        level: "โชคดีมาก",
        title: "ดวงขึ้นทั้งเรื่องงานและใจ",
        main: "ทั้งเรื่องงาน/การเรียน และความสัมพันธ์มีแนวโน้มสดใสไปพร้อมกัน",
        advice:
          "ใช้ช่วงนี้ในการวางรากฐานสำคัญ เช่น สร้างโปรเจกต์ระยะยาว เรียนสกิลใหม่ หรือเปิดใจคุยกับคนสำคัญ",
      },
    ];

    const boxVisual = document.getElementById("boxVisual");
    const seimseeImg = document.getElementById("seimseeImg");
    const tapStatus = document.getElementById("tapStatus");

    const resultModal = document.getElementById("resultModal");
    const resultNumber = document.getElementById("resultNumber");
    const resultLevel = document.getElementById("resultLevel");
    const resultTitle = document.getElementById("resultTitle");
    const resultMain = document.getElementById("resultMain");
    const resultAdvice = document.getElementById("resultAdvice");
    const modalCloseBtn = document.getElementById("modalCloseBtn");

    let isDrawing = false;

    let tapCount = 0;
    let tapTimer = null;
    const TAP_RESET_DELAY = 1500;

    function getRandomFortune() {
      const index = Math.floor(Math.random() * fortunes.length);
      return fortunes[index];
    }

    function openModal() {
      resultModal.classList.add("show");
    }

    function closeModal() {
      resultModal.classList.remove("show");
    }

    function showResult(fortune) {
      resultNumber.textContent = `ใบที่ ${fortune.number}`;
      resultLevel.textContent = fortune.level;
      resultLevel.classList.remove("good", "bad");

      if (
        fortune.level.includes("ไม่ค่อยดี") ||
        fortune.level.includes("เสี่ยง")
      ) {
        resultLevel.classList.add("bad");
      } else if (fortune.level.includes("ดี")) {
        resultLevel.classList.add("good");
      }

      resultTitle.textContent = fortune.title;
      resultMain.textContent = fortune.main;
      resultAdvice.textContent = fortune.advice;

      openModal();
    }

    function performDraw() {
      if (isDrawing) return;
      isDrawing = true;

      boxVisual.classList.add("box-shake");
      tapStatus.textContent = "กำลังสุ่มใบเซียมซีให้คุณ... 🔮";

      setTimeout(() => {
        const fortune = getRandomFortune();
        showResult(fortune);

        boxVisual.classList.remove("box-shake");
        tapStatus.textContent =
          "แตะที่รูป 5 ครั้งภายในเวลาสั้น ๆ ระบบจะสุ่มใบเซียมซีให้คุณ 🎲";

        isDrawing = false;
      }, 900);
    }

    function animateTapShake() {
      seimseeImg.classList.remove("tap-shake");
      void seimseeImg.offsetWidth;
      seimseeImg.classList.add("tap-shake");
    }

    function handleTap() {
      animateTapShake();

      tapCount += 1;

      if (tapTimer) clearTimeout(tapTimer);

      tapTimer = setTimeout(() => {
        tapCount = 0;
        tapStatus.textContent =
          "แตะที่รูป 5 ครั้งภายในเวลาสั้น ๆ ระบบจะสุ่มใบเซียมซีให้คุณ 🎲";
      }, TAP_RESET_DELAY);

      tapStatus.textContent = `แตะแล้ว ${tapCount} ครั้ง (ครบ 5 ครั้งจะสุ่มให้)`;

      if (tapCount >= 5) {
        tapCount = 0;
        if (tapTimer) {
          clearTimeout(tapTimer);
          tapTimer = null;
        }
        performDraw();
      }
    }

    seimseeImg.addEventListener("click", handleTap);
    seimseeImg.addEventListener("touchend", (e) => {
      e.preventDefault();
      handleTap();
    });

    modalCloseBtn.addEventListener("click", closeModal);
    resultModal.addEventListener("click", (e) => {
      if (e.target === resultModal) closeModal();
    });

    document.getElementById("yearNow").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
